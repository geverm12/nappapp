name: NapApp
options:
  bundleIdPrefix: com.tudominio

targets:
  TuAppIOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: .
        excludes:
          - WatchApp
    settings:
      INFOPLIST_FILE: Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.tudominio.nappapp
      CODE_SIGN_ENTITLEMENTS: NapApp.entitlements

  TuAppWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: .
        includes:
          - WatchApp/**/*.swift
          - WatchApp/*.swift
          - WatchApp/Info.plist
          - NapController.swift
          - WorkoutManager.swift
          - MotionSampler.swift
          - SleepDetector.swift
          - NapConfig.swift
      - path: WatchApp
    settings:
      INFOPLIST_FILE: WatchApp/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.tudominio.nappapp.watchkitapp
