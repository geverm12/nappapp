name: Build and Package App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode Version
      run: |
        sudo xcode-select -s /Applications/Xcode.app
        xcodebuild -version

    - name: Install XcodeGen
      run: |
        brew install xcodegen
        xcodegen --version

    - name: Generate Xcode Project
      run: |
        echo "Generando el archivo .xcodeproj con XcodeGen..."
        xcodegen generate

    - name: Build iOS App
      run: |
        echo "Compilando aplicación de iOS..."
        xcodebuild build \
          -project NapApp.xcodeproj \
          -sdk iphoneos \
          -target TuAppIOS \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CONFIGURATION_BUILD_DIR="./build/Release-iphoneos"

    - name: Build watchOS App Extension
      run: |
        echo "Compilando extensión de Apple Watch..."
        xcodebuild build \
          -project NapApp.xcodeproj \
          -sdk watchos \
          -target TuAppWatch \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CONFIGURATION_BUILD_DIR="./build/Release-watchos"

    - name: Package .ipa for Sideloadly
      run: |
        echo "Empaquetando estructura del IPA..."
        mkdir -p Payload
        
        # Copiar la app de iOS al Payload
        cp -R "./build/Release-iphoneos/TuAppIOS.app" "Payload/TuApp.app"
        
        # Crear la carpeta Watch dentro de la app de iOS e insertar la app de watchOS
        mkdir -p "Payload/TuApp.app/Watch"
        if [ -d "./build/Release-watchos/TuAppWatch.app" ]; then
          cp -R "./build/Release-watchos/TuAppWatch.app" "Payload/TuApp.app/Watch/"
        fi
        
        # Comprimir en formato ZIP y renombrar a IPA
        zip -r MiAppWatch.ipa Payload
        echo "¡IPA generado con éxito!"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MiAppWatch-IPA
        path: MiAppWatch.ipa
