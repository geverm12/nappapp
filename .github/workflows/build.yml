name: Compilar Proyecto Swift a IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Compilar archivos Swift para watchOS 10
      run: |
        mkdir -p AppStructure/Payload/App.app
        
        # Compila actualizando el target de despliegue a watchOS 10.0
        find . -name "*.swift" | sort -u | xargs swiftc \
          -sdk $(xcrun --sdk watchos --show-sdk-path) \
          -target arm64_32-apple-watchos10.0 \
          -emit-executable \
          -framework SwiftUI \
          -framework WatchKit \
          -framework Foundation \
          -o AppStructure/Payload/App.app/App

        # Genera el archivo Info.plist básico obligatorio
        cat << 'EOF' > AppStructure/Payload/App.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.tuusuario.miapawatch</string>
            <key>CFBundleName</key>
            <string>SiestaApp</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
        </dict>
        </plist>
        EOF

        cd AppStructure
        zip -r ../MiAppWatch.ipa Payload
        cd ..

    - name: Subir archivo IPA resultante
      uses: actions/upload-artifact@v4
      with:
        name: mi-app-ipa
        path: MiAppWatch.ipa
