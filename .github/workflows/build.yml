name: Compilar Proyecto Swift a IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Compilar todos los archivos Swift en un ejecutable
      run: |
        mkdir -p AppStructure/Payload/App.app
        
        # Busca y compila automáticamente cualquier archivo .swift del repositorio
        swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
               -target arm64-apple-ios15.0 \
               -emit-executable \
               -o AppStructure/Payload/App.app/App \
               $(find . -name "*.swift")

        # Genera el archivo Info.plist básico obligatorio para iOS
        cat << 'EOF' > AppStructure/Payload/App.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.tuusuario.miapawatch</string>
            <key>CFBundleName</key>
            <string>MiAppWatch</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
        </dict>
        </plist>
        EOF

        cd AppStructure
        zip -r ../MiAppWatch.ipa Payload
        cd ..

    - name: Subir archivo IPA resultante
      uses: actions/upload-artifact@v4
      with:
        name: mi-app-ipa
        path: MiAppWatch.ipa
