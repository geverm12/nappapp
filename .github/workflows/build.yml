name: Compilar Proyecto iOS y watchOS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Compilar App de iOS y App de Watch
      run: |
        mkdir -p AppStructure/Payload/App.app/Watch/WatchApp.app
        
        # 1. Compilación para iOS (iPhone) - Sin incluir WorkoutManager
        swiftc \
          -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
          -target arm64-apple-ios17.0 \
          -emit-executable \
          ContentView.swift NapConfig.swift \
          -framework SwiftUI \
          -framework UIKit \
          -framework Foundation \
          -framework UserNotifications \
          -o AppStructure/Payload/App.app/App

        # Info.plist de iOS
        cat << 'EOF' > AppStructure/Payload/App.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.tuusuario.miapawatch</string>
            <key>CFBundleName</key>
            <string>SiestaApp</string>
            <key>CFBundleExecutable</key>
            <string>App</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>17.0</string>
            <key>UIDeviceFamily</key>
            <array>
                <integer>1</integer>
            </array>
        </dict>
        </plist>
        EOF

        # 2. Compilación para watchOS (Apple Watch) - Incluyendo WorkoutManager y sensores
        swiftc \
          -sdk $(xcrun --sdk watchos --show-sdk-path) \
          -target arm64_32-apple-watchos26.0 \
          -emit-executable \
          NapController.swift WorkoutManager.swift MotionSampler.swift SleepDetector.swift NapConfig.swift WatchApp/WatchApp.swift WatchApp/WatchContentView.swift \
          -framework SwiftUI \
          -framework Foundation \
          -framework HealthKit \
          -framework UserNotifications \
          -framework WatchKit \
          -o AppStructure/Payload/App.app/Watch/WatchApp.app/WatchApp

        # Info.plist de watchOS
        cat << 'EOF' > AppStructure/Payload/App.app/Watch/WatchApp.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.tuusuario.miapawatch.watchkitapp</string>
            <key>CFBundleName</key>
            <string>SiestaWatch</string>
            <key>CFBundleExecutable</key>
            <string>WatchApp</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>WKWatchKitApp</key>
            <true/>
            <key>MinimumOSVersion</key>
            <string>26.0</string>
        </dict>
        </plist>
        EOF

        # 3. Empaquetar IPA final
        cd AppStructure
        zip -r ../MiAppWatch.ipa Payload
        cd ..

    - name: Subir archivo IPA resultante
      uses: actions/upload-artifact@v4
      with:
        name: mi-app-ipa
        path: MiAppWatch.ipa
